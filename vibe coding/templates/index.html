<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJTUClaw</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:#1a1a2e; color:#eee; height:100vh; display:flex; }
.sidebar { width:260px; background:#16213e; padding:16px; display:flex;
  flex-direction:column; gap:8px; overflow-y:auto; }
.sidebar h2 { font-size:15px; color:#e94560; margin-bottom:4px; }
.sidebar button { width:100%; padding:8px; border:none; border-radius:6px;
  background:#0f3460; color:#eee; cursor:pointer; font-size:13px; }
.sidebar button:hover { background:#e94560; }
.session-item { padding:8px 10px; border-radius:6px; cursor:pointer;
  font-size:13px; background:#0f3460; margin-bottom:4px; display:flex;
  justify-content:space-between; align-items:center; }
.session-item.active { background:#e94560; }
.session-item .count { font-size:11px; color:#aaa; }
.main { flex:1; display:flex; flex-direction:column; }
.header { padding:12px 20px; background:#16213e; font-size:14px;
  border-bottom:1px solid #0f3460; display:flex; justify-content:space-between; }
.messages { flex:1; overflow-y:auto; padding:20px; display:flex;
  flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px;
  font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.msg.user { align-self:flex-end; background:#e94560; }
.msg.assistant { align-self:flex-start; background:#0f3460; }
.msg.tool_call, .msg.tool_result { align-self:flex-start; font-size:12px;
  background:#1a1a2e; color:#aaa; border:1px dashed #333; }
.msg.error { align-self:center; background:#ff4444; color:#fff; font-size:13px; }
.input-area { padding:12px 20px; background:#16213e; display:flex; gap:8px; }
.input-area input { flex:1; padding:10px 14px; border:none; border-radius:8px;
  background:#0f3460; color:#eee; font-size:14px; outline:none; }
.input-area input:focus { box-shadow:0 0 0 2px #e94560; }
.input-area button { padding:10px 20px; border:none; border-radius:8px;
  background:#e94560; color:#fff; cursor:pointer; font-size:14px; }
.input-area button:disabled { opacity:0.5; cursor:not-allowed; }
.spinner { display:none; align-self:flex-start; padding:8px; color:#aaa; }
.spinner.show { display:block; }
.upload-label { cursor:pointer; padding:10px 12px; background:#0f3460;
  border-radius:8px; font-size:13px; display:flex; align-items:center; }
.upload-label:hover { background:#e94560; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>SJTUClaw</h2>
  <button onclick="newSession()">+ 新建会话</button>
  <div id="session-list"></div>
  <div style="margin-top:auto; font-size:11px; color:#555;">
    LLM KEY 仅保存在服务端，前端不可见。
  </div>
</div>

<div class="main">
  <div class="header">
    <span id="current-session">--</span>
    <span id="attachment-info"></span>
  </div>
  <div class="messages" id="messages">
    <div class="msg assistant">你好！我是 SJTUClaw，有什么可以帮你的喵~</div>
  </div>
  <div class="spinner" id="spinner">思考中...</div>
  <div class="input-area">
    <label class="upload-label" title="上传附件">
      📎<input type="file" id="file-input" style="display:none"
        onchange="uploadFile()">
    </label>
    <input id="user-input" placeholder="输入消息..." autofocus
      onkeydown="if(event.key==='Enter') send()">
    <button id="send-btn" onclick="send()">发送</button>
  </div>
</div>

<script>
let currentSessionId = '';

async function api(url, options={}) {
  const resp = await fetch(url, options);
  return resp.json();
}

async function loadSessions() {
  const sessions = await api('/api/sessions');
  const list = document.getElementById('session-list');
  list.innerHTML = sessions.map(s =>
    `<div class="session-item${s.session_id===currentSessionId?' active':''}"
      onclick="switchSession('${s.session_id}')">
      <span>${s.title||'未命名'}</span>
      <span class="count">${s.message_count}条</span>
    </div>`
  ).join('');
  if (!currentSessionId && sessions.length) {
    currentSessionId = sessions[0].session_id;
    updateHeader(sessions[0]);
  }
}

function updateHeader(s) {
  document.getElementById('current-session').textContent =
    `${s.title||s.session_id} (${s.session_id})`;
}

async function switchSession(id) {
  const data = await api('/api/switch', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: id})
  });
  if (data.error) { alert(data.error); return; }
  currentSessionId = id;
  document.getElementById('messages').innerHTML = '';
  if (data.messages) data.messages.forEach(m => appendMsg(m));
  loadSessions();
  updateHeader(data);
  loadAttachments();
}

async function newSession() {
  const data = await api('/api/sessions', {method:'POST'});
  if (data.session_id) {
    currentSessionId = data.session_id;
    document.getElementById('messages').innerHTML =
      '<div class="msg assistant">新会话已创建喵~</div>';
    loadSessions();
    updateHeader(data);
  }
}

async function send() {
  const input = document.getElementById('user-input');
  const msg = input.value.trim();
  if (!msg) return;

  appendMsg({role:'user', content:msg});
  input.value = '';
  document.getElementById('spinner').classList.add('show');
  document.getElementById('send-btn').disabled = true;

  try {
    const data = await api('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg})
    });
    document.getElementById('spinner').classList.remove('show');
    document.getElementById('send-btn').disabled = false;
    if (data.error) {
      appendMsg({role:'error', content: '错误: '+data.error});
    } else {
      appendMsg({role:'assistant', content: data.reply});
      if (data.compact) {
        appendMsg({role:'tool_result',
          content: `[已压缩] ${data.compact.old_messages}→${data.compact.new_messages}条`});
      }
    }
    loadSessions();
  } catch(e) {
    document.getElementById('spinner').classList.remove('show');
    document.getElementById('send-btn').disabled = false;
    appendMsg({role:'error', content: '网络错误: '+e.message});
  }
}

function appendMsg(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + (m.role||'assistant');
  div.textContent = m.content||'';
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}

async function uploadFile() {
  const file = document.getElementById('file-input').files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  const resp = await fetch('/api/upload', {method:'POST', body:form});
  const data = await resp.json();
  if (data.ok) {
    appendMsg({role:'tool_result',
      content: `[已上传] ${data.file.name} (${data.file.size} bytes)`});
    loadAttachments();
  }
}

async function loadAttachments() {
  const data = await api('/api/attachments');
  const info = document.getElementById('attachment-info');
  info.textContent = data.length ? `附件: ${data.length}个` : '';
}

loadSessions();
</script>
</body>
</html>
